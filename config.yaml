title: 'Agricoltura, vivaismo ed informatica'
baseURL: /
defaultContentLanguage: "it"
defaultContentLangageInSubdir: false
theme: "vr02"
languages:
 it:
  lang: "it"
  label: "Italiano"
  locale: "it_IT"
  weight: 1
 en:
  lang: "en"
  label: "English"
  locale: "en_US"
  weight: 2
# fr:
#  lang: "fr"
#  label: "Français"
#  locale: "fr_FR"
#  weight: 3
params:
  palette: verderam01
  palettes:
    blue:
      sass:
        accent1: '#00c6ff'
        accent2: '#0072ff'
    green:
      sass:
        accent1: '#12db5d'
        accent2: '#11998e'
    verderam01:
      sass:
        accent1: '#006633'
        accent2: '#4CA22F'
    navy:
      sass:
        accent1: '#004e92'
        accent2: '#000428'
    violet:
      sass:
        accent1: '#8e2de2'
        accent2: '#4a00e0'
#menu:
#  main:
#    - identifier: help
#      weight: 999
#      name: Help 🔗
#      url: 'https://www.dwservice.net/'
#      target: _blank
#      parent: informatica
disableKinds:
  - RSS
  - robotsTXT
  - "404"
  - taxonomy
  - term
taxonomies: {}
enableEmoji: true
pluralizeListTitles: false
paginate: 20
verbose: true
markup:
  goldmark:
    renderer:
      unsafe: true
imaging:
  resampleFilter: 'box'
  anchor: 'smart'
  jpeg:
    quality: 95
  webp:
    quality: 95