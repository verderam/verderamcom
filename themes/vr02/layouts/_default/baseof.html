<!doctype html>
<html>
    <head>    
        <title>{{ if .Title }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#006633" />
        <link rel="stylesheet" href="/assets/css/vr.css" />
        <!--[if IE]>
          <link rel="stylesheet" href="/assets/css/ie.css" />
        <![endif]-->
        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
        <!--  translations -->
        {{ if .IsTranslated }}
          {{ range .Translations }}
            <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}" title="{{ .Language.Label }}" />
          {{ end }}
        {{ end }}
    </head>
    <body>
        {{ block "body" .}}
        <div id="page" class="site {{ if .Title }}{{ .Name | anchorize }}{{ end }}">
          {{ partial "header.html" . }}
          <!--
          <a href="#fatspecial-popup" class="fatspecial-badge" aria-label="Fattorie aperte! Clicca per saperne di più.">
            <img src="/images/fatspecial.gif" alt="Fattorie aperte!" />
          </a>
          <div class="css-popup" id="fatspecial-popup" role="dialog" aria-label="Fattorie aperte!">
            <a href="#" class="css-popup-overlay" tabindex="-1" aria-hidden="true"></a>
            <div class="css-popup-content">
              <a href="#" class="css-popup-close" aria-label="Chiudi">&times;</a>
              <img src="/images/fatap.jpg" alt="Fattorie aperte!" />
            </div>
          </div>
        -->
          <main id="content" class="main">
            {{ block "content" . }}{{ end }}
            {{ block "c2" . }}{{ end }}
          </main><!-- .site-content -->
          {{ partial "footer.html" . }}
        </div><!-- .site -->
        {{ end }} <!--  end block body -->
        <script data-no-instant src="{{ "assets/js/lazyload.min.js" | relURL }}"></script>
        <script data-no-instant src="{{ "assets/js/init.js" | relURL }}"></script>
    </body> 
</html>
