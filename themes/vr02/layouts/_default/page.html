{{ define "content" }}
<section class="pg">
    {{ partial "pg_header.html" .}}
    <article class="inner txt padl page">
        {{- if .Params.cover }}
            {{- $img := partial "find_image.html" (dict "path" .Params.cover "page" .) }}
            {{- if $img }}
              <figure class="cover hs" style="margin:-7em -4.5em 2em 2em;float:right">
                {{ partial "img_responsive.html" (dict "img" $img "alt" (.Params.cover_alt | default "") "class" "oz res sh brd rdx" "w" 480 "h" 360 "sizes" "480px" "lazy" false) }}
              </figure>
            {{- end }}
        {{- end }}
        {{ .Content }}
      </article>
</section>
{{ partial "citation.html" . }}
{{ end }}
