{{ define "body" }}
{{ $menu := .Site.Menus.main }}
{{ partial "logo_symbol.html" . }}
<main id="content" class="inner toc-page ac" tabindex="-1">
  <h1 class="sr">Menu</h1>
  <nav aria-label="Menu del sito">
    <a href="/">🏡 Home</a>
    {{- range $item := $menu }}
    <a href="{{ if strings.HasPrefix $item.URL "#" }}{{ $item.URL }}{{ else }}{{ $item.URL | relURL }}{{ end }}">{{ $item.Name }}</a>
    {{- end }}
  </nav>
</main>
{{ end }}
